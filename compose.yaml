services:
  withhuman:
    build: .
    container_name: withhuman
    expose:
      - "8080"
      - "9000"

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.5.0
    container_name: agentgateway
    depends_on:
      - withhuman
    ports:
      - "3000:3000"
    volumes:
      - ./agentgateway.yaml:/config.yaml:ro
    command:
      - "-f"
      - "/config.yaml"
