[package]
name = "withhuman"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
tower = { version = "0.5.3", default-features = false, features = ["util"] }
