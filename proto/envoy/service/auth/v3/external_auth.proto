syntax = "proto3";

package envoy.service.auth.v3;

import "envoy/type/v3/http_status.proto";
import "google/rpc/status.proto";

// Wire-compatible subset of Envoy's External Authorization v3 API.
// Field numbers match upstream, so AgentGateway/Envoy can talk to this
// server with the real proto definitions on their side.
service Authorization {
  rpc Check(CheckRequest) returns (CheckResponse);
}

message CheckRequest {
  AttributeContext attributes = 1;
}

// Only the path down to the HTTP request is declared; prost silently skips
// the other upstream fields (source, destination, context_extensions, ...).
message AttributeContext {
  message Request {
    HttpRequest http = 2;
  }

  message HttpRequest {
    string method = 2;
    string path = 4;
    // Set when the gateway forwards the body (`includeRequestBody`).
    string body = 11;
    // Used instead of `body` when the gateway sets `packAsBytes`.
    bytes raw_body = 12;
  }

  Request request = 4;
}

message CheckResponse {
  google.rpc.Status status = 1;
  // Upstream declares fields 2 and 3 inside a `http_response` oneof.
  // An allow is a bare OK status, so WithHuman only ever sets the denied
  // branch, and encoding field 2 alone is byte-identical either way.
  DeniedHttpResponse denied_response = 2;
}

message DeniedHttpResponse {
  envoy.type.v3.HttpStatus status = 1;
  // Field 2 (headers) is omitted because WithHuman sets no headers.
  string body = 3;
}
