# Single entry point for the deployment: everything external arrives here.
# WithHuman stays private on the Compose network (withhuman:8080 / :9000).
binds:
  - port: 3000
    listeners:
      - name: default
        routes:
          # Internal tools. Claude Code's PreToolUse hook posts here and the
          # request is proxied to WithHuman's hook API. No extAuthz on this
          # route: this *is* the decision endpoint, so guarding it with
          # WithHuman would be circular.
          - name: hook
            matches:
              - path:
                  pathPrefix: /v1/hooks/pre-tool
            backends:
              - host: withhuman:8080

          # External tools. Every MCP request is authorized by WithHuman over
          # gRPC extAuthz first. The JSON-RPC body is forwarded so WithHuman
          # can let the handshake and tools/list through and deny tools/call.
          - name: mcp
            matches:
              - path:
                  pathPrefix: /
            policies:
              extAuthz:
                host: withhuman:9000
                protocol:
                  grpc: {}
                includeRequestBody:
                  # Large tool arguments must still reach WithHuman whole;
                  # a truncated body would not parse and would be denied.
                  maxRequestBytes: 1048576
            backends:
              # GitHub's remote MCP server over HTTPS, so the official
              # distroless image needs no node/npx. There is no token here:
              # each Claude Code client sends its own GitHub token in the
              # Authorization header and AgentGateway forwards it upstream.
              - mcp:
                  targets:
                    - name: github
                      mcp:
                        host: https://api.githubcopilot.com/mcp/
